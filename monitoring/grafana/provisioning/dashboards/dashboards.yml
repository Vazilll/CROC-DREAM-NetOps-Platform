apiVersion: 1

providers:
  - name: "CROC DREAM NetOps Dashboards"
    orgId: 1
    folder: "CROC DREAM Enterprise NOC"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
