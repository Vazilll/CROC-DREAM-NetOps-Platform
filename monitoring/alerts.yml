groups:
  - name: fabric_triggers
    rules:
      # 1. Коммутатор целиком перестал отвечать по SNMP
      - alert: DeviceDown
        expr: up{job="snmp_fabric", tier="live"} == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: "Коммутатор {{ $labels.hostname }} ({{ $labels.vendor }}) недоступен"
          description: "Prometheus потерял связь с {{ $labels.instance }} [{{ $labels.os }}] (SNMP timeout > 20s)"

      # 2. Недавняя перезагрузка устройства (Uptime < 5 минут)
      - alert: DeviceRebooted
        expr: (sysUpTime{job="snmp_hardware_and_bgp"} / 100) < 300
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "Коммутатор {{ $labels.hostname }} недавно перезагрузился"
          description: "Uptime устройства {{ $labels.hostname }} ({{ $labels.vendor }}) составляет менее 5 минут"

      # 3. Упал межузловой линк (все 6 вендоров)
      - alert: FabricLinkDown
        expr: >
          ifOperStatus{
            job="snmp_fabric",
            ifDescr=~"GigabitEthernet[23]|Ethernet[0-9]+|GE1/0/[019]|gi1/0/[0-9]+|te1/0/[0-9]+|10GE1/0/[0-9]+"
          } == 2
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Упал порт {{ $labels.ifDescr }} на {{ $labels.hostname }} ({{ $labels.vendor }})"
          description: "Интерфейс {{ $labels.ifDescr }} ({{ $labels.ifAlias }}) перешел в состояние DOWN (ifOperStatus=2)"

      # 4. Дропы пакетов на порту (ACL / переполнение буфера)
      - alert: HighInterfaceDiscards
        expr: (rate(ifInDiscards{job="snmp_fabric"}[1m]) + rate(ifOutDiscards{job="snmp_fabric"}[1m])) > 5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Сброс пакетов на {{ $labels.hostname }} ({{ $labels.ifDescr }})"
          description: "Дропы пакетов на порту превышают 5 pkt/s (вендор: {{ $labels.vendor }})"

      # 5. Ошибки на физическом уровне (CRC / Frame Errors)
      - alert: InterfacePacketErrors
        expr: (rate(ifInErrors{job="snmp_fabric"}[1m]) + rate(ifOutErrors{job="snmp_fabric"}[1m])) > 1
        for: 20s
        labels:
          severity: warning
        annotations:
          summary: "Ошибки L1/L2 на порту {{ $labels.ifDescr }} ({{ $labels.hostname }})"
          description: "На интерфейсе {{ $labels.ifDescr }} фиксируются ошибки приема/передачи"

      # 6. Перегрузка канала (> 80% от скорости порта)
      - alert: HighLinkUtilization
        expr: >
          (
            (rate(ifHCInOctets{job="snmp_fabric"}[1m]) * 8)
            / (ifHighSpeed{job="snmp_fabric"} * 1000000 > 0)
          ) * 100 > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка канала {{ $labels.ifDescr }} на {{ $labels.hostname }}"
          description: "Утилизация интерфейса {{ $labels.ifDescr }} превысила 80%"

      # 7. Высокая загрузка CPU (> 85%)
      - alert: HighCpuLoad
        expr: avg by (hostname, vendor) (hrProcessorLoad) > 85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Высокая нагрузка CPU на {{ $labels.hostname }} ({{ $labels.vendor }})"
          description: "Средняя загрузка CPU превышает 85% в течение 1 минуты"