global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "netops_backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "snmp_fabric"
    scrape_interval: 10s
    scrape_timeout: 8s
    metrics_path: /snmp
    params:
      module: [if_mib]
    file_sd_configs:
      - files:
          - /app/lab/running/prometheus_targets.json
        refresh_interval: 10s
    static_configs:
      - targets:
          - 172.20.20.5
          - 172.20.20.4
          - 172.20.20.2
          - 172.20.20.6
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: "172\\.20\\.20\\.5"
        target_label: hostname
        replacement: "spine-1.croc.lab"
      - source_labels: [__param_target]
        regex: "172\\.20\\.20\\.4"
        target_label: hostname
        replacement: "spine-2.croc.lab"
      - source_labels: [__param_target]
        regex: "172\\.20\\.20\\.2"
        target_label: hostname
        replacement: "leaf-1.croc.lab"
      - source_labels: [__param_target]
        regex: "172\\.20\\.20\\.6"
        target_label: hostname
        replacement: "leaf-2.croc.lab"
      - target_label: __address__
        replacement: snmp-exporter:9116
