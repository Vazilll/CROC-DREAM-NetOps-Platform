global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

# Долгая история — в VictoriaMetrics; Prometheus держит короткое окно для алертов и
# оперативных запросов платформы (прогноз, /api/v1/targets).
remote_write:
  - url: http://victoriametrics:8428/api/v1/write

# Цели SNMP / exporter / gNMI пишет платформа (backend/netops/telemetry/targets.py) после
# проверки протокола. Ручных списков IP здесь нет: метки hostname/fabric_id/platform
# приходят из файлов целей.
scrape_configs:
  - job_name: "netops_backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "snmp_fabric"
    scrape_interval: 30s
    scrape_timeout: 25s
    metrics_path: /snmp
    params:
      auth: [public_v2]
      module: [if_mib]
    file_sd_configs:
      - files:
          - /app/lab/running/prometheus_targets.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: "snmp_hardware"
    scrape_interval: 30s
    scrape_timeout: 25s
    metrics_path: /snmp
    params:
      auth: [public_v2]
    file_sd_configs:
      - files:
          - /app/lab/running/prometheus_targets.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [snmp_module]
        regex: ".+"
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [snmp_module]
        target_label: __param_module
      - target_label: __address__
        replacement: snmp-exporter:9116

  - job_name: "node_exporter_fleet"
    scrape_interval: 30s
    file_sd_configs:
      - files:
          - /app/lab/running/exporter_targets.json
        refresh_interval: 30s

  - job_name: "gnmic"
    scrape_interval: 30s
    static_configs:
      - targets: ["gnmic:9804"]
