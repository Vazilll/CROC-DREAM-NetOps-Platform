# Backend-only stack for local development:
#   docker compose -f docker-compose.dev.yml up --build
# The team-wide docker-compose.yml (UI, Grafana, ...) lives at the repository root.
x-backend: &backend
  build: .
  env_file: .env
  environment:
    NETOPS_DATABASE_URL: postgresql+psycopg://netops:netops@postgres:5432/netops
    NETOPS_REDIS_URL: redis://redis:6379/0
    NETOPS_INTENT_REPO_PATH: /data/intent
    NETOPS_TEMPLATES_PATH: /data/templates
    NETOPS_OFFLINE_LAB_PATH: /data/lab
  volumes:
    - ${INTENT_REPO:-../intent}:/data/intent:ro
    - ${TEMPLATES:-../templates}:/data/templates:ro
    - ${OFFLINE_LAB:-../lab/running}:/data/lab
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netops
      POSTGRES_PASSWORD: netops
      POSTGRES_DB: netops
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netops"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn netops.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A netops.worker.tasks worker --loglevel=INFO --concurrency=4

  beat:
    <<: *backend
    command: celery -A netops.worker.tasks beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

volumes:
  postgres-data:
