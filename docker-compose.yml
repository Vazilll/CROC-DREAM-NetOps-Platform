# CROC DREAM NetOps Platform — весь стек одной командой:
#
#   docker compose up -d --build
#
# Веб-консоль (React + Nginx): http://localhost:5173
# API и Swagger:               http://localhost:8000/docs
# Prometheus UI:               http://localhost:9090/targets
# VictoriaMetrics (история):   http://localhost:8428/vmui
name: netops

x-backend: &backend
  build: ./backend
  image: netops-backend
  env_file:
    - path: backend/.env
      required: false
  environment:
    NETOPS_DATABASE_URL: postgresql+psycopg://netops:netops@postgres:5432/netops
    NETOPS_REDIS_URL: redis://redis:6379/0
    NETOPS_INTENT_REPO_PATH: /data/intent
    NETOPS_TEMPLATES_PATH: /data/templates
    NETOPS_OFFLINE_LAB_PATH: /data/lab
    NETOPS_PROMETHEUS_URL: ${NETOPS_PROMETHEUS_URL:-http://prometheus:9090}
    NETOPS_API_TOKENS: '{"dev-owner-token": {"username": "owner", "role": "owner"}, "dev-admin-token": {"username": "admin", "role": "admin"}, "dev-operator-token": {"username": "operator", "role": "operator"}, "dev-viewer-token": {"username": "viewer", "role": "viewer"}, "croc-admin-token": {"username": "admin", "role": "admin"}, "croc-demo-jury": {"username": "jury", "role": "viewer"}}'
  volumes:
    - ${INTENT_REPO:-./intent}:/data/intent
    - ${TEMPLATES:-./templates}:/data/templates:ro
    - ${OFFLINE_LAB:-./lab/running}:/data/lab
    - ./lab:/app/lab
    - ./monitoring:/data/monitoring:ro
  restart: unless-stopped
  depends_on:
    api:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netops
      POSTGRES_PASSWORD: netops
      POSTGRES_DB: netops
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U netops -d netops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && exec uvicorn netops.main:app --host 0.0.0.0 --port 8000"
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *backend
    command: celery -A netops.worker.tasks worker --loglevel=INFO --concurrency=4

  beat:
    <<: *backend
    command: celery -A netops.worker.tasks beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  telegram-bot:
    <<: *backend
    command: python -m netops.telemetry.bot

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports: ["${NODE_EXPORTER_PORT:-9100}:9100"]
    restart: unless-stopped

  snmp-exporter:
    image: prom/snmp-exporter:v0.26.0
    ports: ["${SNMP_EXPORTER_PORT:-9116}:9116"]
    volumes:
      - ./monitoring/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    restart: unless-stopped

  # gNMI-поток с устройств, которые платформа проверила через gRPC Capabilities.
  gnmic:
    image: ghcr.io/openconfig/gnmic:0.49.0
    command: ["--config", "/etc/gnmic/gnmic.yaml", "subscribe"]
    environment:
      GNMIC_USERNAME: ${GNMIC_USERNAME:-admin}
      GNMIC_PASSWORD: ${GNMIC_PASSWORD:-admin}
    ports: ["${GNMIC_PORT:-9804}:9804"]
    volumes:
      - ./monitoring/gnmic/gnmic.yaml:/etc/gnmic/gnmic.yaml:ro
      - ${OFFLINE_LAB:-./lab/running}:/data/lab:ro
    restart: unless-stopped

  # Долговременное хранилище рядов (Prometheus пишет сюда через remote_write).
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${VM_RETENTION:-12}
      - -httpListenAddr=:8428
    ports: ["${VM_PORT:-8428}:8428"]
    volumes: [vm-data:/storage]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - ${OFFLINE_LAB:-./lab/running}:/app/lab/running:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    depends_on:
      - snmp-exporter
      - node-exporter
      - gnmic
      - victoriametrics

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/croc-dream-1000-stand-noc.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - victoriametrics
      - postgres

  frontend:
    build: ./frontend
    image: netops-frontend
    ports: ["${FRONTEND_PORT:-5173}:80"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  prometheus-data:
  vm-data:
  grafana-data:
