# CROC DREAM NetOps Platform — весь стек одной командой:
#
#   docker compose up --build
#
# API и Swagger: http://localhost:8000/docs
# Настройки бэкенда (токены, SSH-профили) — в backend/.env, пример в backend/.env.example.
# Порты и каталоги с данными переопределяются переменными ниже (например, в ./.env).
name: netops

x-backend: &backend
  build: ./backend
  image: netops-backend
  env_file:
    - path: backend/.env
      required: false
  environment:
    NETOPS_DATABASE_URL: postgresql+psycopg://netops:netops@postgres:5432/netops
    NETOPS_REDIS_URL: redis://redis:6379/0
    NETOPS_INTENT_REPO_PATH: /data/intent
    NETOPS_TEMPLATES_PATH: /data/templates
    NETOPS_OFFLINE_LAB_PATH: /data/lab
  volumes:
    - ${INTENT_REPO:-./intent}:/data/intent:ro
    - ${TEMPLATES:-./templates}:/data/templates:ro
    - ${OFFLINE_LAB:-./lab/running}:/data/lab
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netops
      POSTGRES_PASSWORD: netops
      POSTGRES_DB: netops
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      # Проверка по TCP: при первом старте временный сервер слушает только сокет.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U netops -d netops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Один раз применяет миграции до старта API, воркера и Beat.
  migrate:
    <<: *backend
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: uvicorn netops.main:app --host 0.0.0.0 --port 8000
    ports: ["${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      retries: 5

  worker:
    <<: *backend
    command: celery -A netops.worker.tasks worker --loglevel=INFO --concurrency=4

  beat:
    <<: *backend
    command: celery -A netops.worker.tasks beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  # Сюда добавятся фронтенд (когда будет образ) и мониторинг, например:
  # frontend:
  #   build: ./frontend
  #   ports: ["${FRONTEND_PORT:-5173}:80"]
  #   depends_on: [api]

volumes:
  postgres-data:
