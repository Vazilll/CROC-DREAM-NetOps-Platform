# Port 80..83 — Authenticated Console (Owner on local hardware / Owner-issued 6-digit code & token over Internet)
server {
    listen 80;
    listen 81;
    listen 82;
    listen 83;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Console-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Id $http_x_client_id;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_read_timeout 300s;
    }

    location ~ ^/(healthz|readyz|metrics|docs|redoc|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
