platform: huawei_vrp
vendor: Huawei Technologies
default_password: F5ga6jfkig
default_interface: GE1/0/0
offline_ports: [2221]
offline_interfaces:
  - GE1/0/0
  - GE1/0/1
ssh_banners:
  - ssh-2.0--
  - huawei
  - vrp
  - rosssh
version_signatures:
  - Huawei
  - VRP
  - HUAWEI
interface_prefixes:
  - GE
  - Gigabit
  - Loop
  - MEth
lldp_port_prefixes:
  - GE
  - Gi
  - eth
commands:
  version: display version
  memory: display memory
  cpu: display cpu
  running_config: display current-configuration
  hostname_filter: display current-configuration | include sysname
  interfaces_brief: display ip interface brief
  lldp_neighbors: display lldp neighbor brief
telemetry:
  cpu_pct:
    command: display cpu
    parser: parse_huawei_cpu
  memory_pct:
    command: display memory
    parser: parse_huawei_memory
  uplink_util_pct:
    command: display interface brief
    parser: max_huawei_link_utilization
gnmi:
  default_port: 57400
  check_command: display grpc
  match_tokens:
    - enabled
    - active
    - running
    - "57400"
    - grpc
snmp:
  base_port: 161
  clab_offset: -600
  hardware_module: huawei_cpu
exporter:
  port: 9100
  path: /metrics
protocol_priority:
  - gnmi
  - snmp
  - ssh_cli
emergency_commands:
  reset_bgp_sessions: reset bgp all
  rollback_last_commit: rollback configuration last 1
  restart_services: reset arp dynamic
  reboot: reboot fast
  default: display version
