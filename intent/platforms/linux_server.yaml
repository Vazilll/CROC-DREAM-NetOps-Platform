platform: linux_server
vendor: Linux
default_password: admin
default_interface: eth0
offline_ports: [2231, 2232]
offline_interfaces:
  - eth0
  - eth1
ssh_banners:
  - ubuntu
  - debian
  - alpine
version_signatures:
  - Linux
interface_prefixes:
  - eth
  - ens
  - lo
lldp_port_prefixes:
  - eth
  - ens
commands:
  version: uname -a
  memory: top -bn1 | head -n 5
  running_config: ip addr show
  hostname_filter: hostname
  interfaces_brief: ip -br addr show
  lldp_neighbors: lldpctl
emergency_commands:
  reset_bgp_sessions: ip route flush cache
  rollback_last_commit: etckeeper vcs checkout || true
  restart_services: ps -eo pid,comm,%cpu,%mem --sort=-%cpu | head -n 10
  reboot: sudo shutdown -r +1
  default: uname -a
