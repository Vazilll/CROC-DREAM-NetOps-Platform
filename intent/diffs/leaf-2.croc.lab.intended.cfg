sysname leaf-2
interface LoopBack0
 description Router-ID / BGP announce
 ip address 10.255.0.2 255.255.255.255
interface GE1/0/0
 undo portswitch
 description Uplink to spine1 GigabitEthernet3
 ip address 10.10.0.3 255.255.255.254
interface GE1/0/1
 undo portswitch
 description Uplink to spine2 Ethernet2
 ip address 10.10.0.7 255.255.255.254
acl name FABRIC-IN advance
 rule 10 permit icmp
 rule 20 permit tcp destination-port eq bgp
 rule 30 permit tcp source-port eq bgp
 rule 40 deny tcp destination-port eq telnet
 rule 50 permit ip
bgp 65002
 router-id 10.255.0.2
 peer 10.10.0.2 as-number 65000
 peer 10.10.0.2 description spine1
 peer 10.10.0.6 as-number 65000
 peer 10.10.0.6 description spine2
 ipv4-family unicast
  network 10.255.0.2 255.255.255.255
  network 10.20.2.0 255.255.255.0
  maximum load-balancing 2
  peer 10.10.0.2 enable
  peer 10.10.0.6 enable
