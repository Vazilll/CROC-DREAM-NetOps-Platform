hostname: leaf-3.croc.lab
interfaces:
  - name: Loopback0
    description: Router ID
    ipv4_address: 10.255.1.3/32
  - name: GE1/0/1
    description: Uplink to spine-1
    ipv4_address: 10.0.3.1/31
    mtu: 9000
  - name: GE1/0/2
    description: Uplink to spine-2
    ipv4_address: 10.0.3.3/31
    mtu: 9000
bgp:
  asn: 65103
  router_id: 10.255.1.3
  neighbors:
    - peer_ip: 10.0.3.0
      remote_asn: 65000
      description: spine-1
      announced_prefixes: ["10.255.1.3/32"]
    - peer_ip: 10.0.3.2
      remote_asn: 65000
      description: spine-2
      announced_prefixes: ["10.255.1.3/32"]
acls:
  - name: MGMT-IN
    rules:
      - sequence: 10
        action: permit
        protocol: tcp
        source: 172.20.20.0/24
        destination: any
      - sequence: 20
        action: deny
        protocol: ip
        source: any
        destination: any
