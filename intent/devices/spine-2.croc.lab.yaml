---
hostname: "spine-2.croc.lab"

interfaces:
  - name: "Ethernet1"
    description: "Downlink to leaf1 GE1/0/1"
    enabled: true
    mode: "l3"
    ipv4_address: "10.10.0.4/31"
    mtu: 1500
    acl_in: "FABRIC-IN"
    ospf_area: "0.0.0.0"

  - name: "Ethernet2"
    description: "Downlink to leaf2 GE1/0/1"
    enabled: true
    mode: "l3"
    ipv4_address: "10.10.0.6/31"
    mtu: 1500
    acl_in: "FABRIC-IN"
    ospf_area: "0.0.0.0"

  - name: "Loopback0"
    description: "Router-ID / BGP announce"
    enabled: true
    mode: "l3"
    ipv4_address: "10.255.0.12/32"
    mtu: 1500
    ospf_area: "0.0.0.0"

bgp:
  asn: 65000
  router_id: "10.255.0.12"
  evpn: true
  neighbors:
    - peer_ip: "10.10.0.5"
      remote_asn: 65001
      description: "leaf1"
      announced_prefixes:
        - "10.255.0.12/32"
    - peer_ip: "10.10.0.7"
      remote_asn: 65002
      description: "leaf2"
      announced_prefixes:
        - "10.255.0.12/32"

acls:
  - name: "FABRIC-IN"
    type: "extended"
    rules:
      - sequence: 10
        action: "permit"
        protocol: "icmp"
      - sequence: 15
        action: "permit"
        protocol: "ospf"
      - sequence: 20
        action: "permit"
        protocol: "tcp"
        dst_port: "bgp"
      - sequence: 30
        action: "permit"
        protocol: "tcp"
        src_port: "bgp"
      - sequence: 40
        action: "deny"
        protocol: "tcp"
        dst_port: "telnet"
      - sequence: 50
        action: "permit"
        protocol: "ip"
