---
hostname: "leaf-1.croc.lab"

interfaces:
  - name: "Vbdif10"
    description: "Anycast gateway VLAN10 10.20.1.0/24"
    enabled: true
    mode: "l3"
    ipv4_address: "10.20.1.1/24"
    mtu: 1500

  - name: "GE1/0/0"
    description: "Uplink to spine1 GigabitEthernet2"
    enabled: true
    mode: "l3"
    ipv4_address: "10.10.0.1/31"
    mtu: 1500
    acl_in: "FABRIC-IN"
    ospf_area: "0.0.0.0"

  - name: "GE1/0/1"
    description: "Uplink to spine2 Ethernet1"
    enabled: true
    mode: "l3"
    ipv4_address: "10.10.0.5/31"
    mtu: 1500
    acl_in: "FABRIC-IN"
    ospf_area: "0.0.0.0"

  - name: "LoopBack0"
    description: "Router-ID / BGP announce / VTEP source"
    enabled: true
    mode: "l3"
    ipv4_address: "10.255.0.1/32"
    mtu: 1500
    ospf_area: "0.0.0.0"

bgp:
  asn: 65001
  router_id: "10.255.0.1"
  evpn: true
  vxlan_vni: 10010
  neighbors:
    - peer_ip: "10.10.0.0"
      remote_asn: 65000
      description: "spine1"
      announced_prefixes:
        - "10.255.0.1/32"
    - peer_ip: "10.10.0.4"
      remote_asn: 65000
      description: "spine2"
      announced_prefixes:
        - "10.255.0.1/32"

acls:
  - name: "FABRIC-IN"
    type: "extended"
    rules:
      - sequence: 10
        action: "permit"
        protocol: "icmp"
      - sequence: 15
        action: "permit"
        protocol: "ospf"
      - sequence: 20
        action: "permit"
        protocol: "tcp"
        dst_port: "bgp"
      - sequence: 30
        action: "permit"
        protocol: "tcp"
        src_port: "bgp"
      - sequence: 40
        action: "deny"
        protocol: "tcp"
        dst_port: "telnet"
      - sequence: 50
        action: "permit"
        protocol: "ip"
