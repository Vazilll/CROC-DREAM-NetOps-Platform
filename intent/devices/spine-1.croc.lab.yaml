---
hostname: "spine-1.croc.lab"

interfaces:
  - name: "Loopback0"
    description: "Router-ID / BGP announce"
    enabled: true
    mode: "l3"
    ipv4_address: "10.255.0.11/32"
    mtu: 1500

  - name: "GigabitEthernet2"
    description: "Downlink to leaf1 GE1/0/0"
    enabled: true
    mode: "l3"
    ipv4_address: "10.10.0.0/31"
    mtu: 1500
    acl_in: "FABRIC-IN"

  - name: "GigabitEthernet3"
    description: "Downlink to leaf2 GE1/0/0"
    enabled: true
    mode: "l3"
    ipv4_address: "10.10.0.2/31"
    mtu: 1500
    acl_in: "FABRIC-IN"

bgp:
  asn: 65000
  router_id: "10.255.0.11"
  neighbors:
    - peer_ip: "10.10.0.1"
      remote_asn: 65001
      description: leaf-1
      announced_prefixes:
        - "10.255.0.11/32"
    - peer_ip: "10.10.0.3"
      remote_asn: 65002
      description: leaf-2
      announced_prefixes:
        - "10.255.0.11/32"

acls:
  - name: "FABRIC-IN"
    type: "extended"
    rules:
      - sequence: 10
        action: "permit"
        protocol: "icmp"
      - sequence: 20
        action: "permit"
        protocol: "tcp"
        dst_port: "bgp"
      - sequence: 30
        action: "permit"
        protocol: "tcp"
        src_port: "bgp"
      - sequence: 40
        action: "deny"
        protocol: "tcp"
        dst_port: "telnet"
      - sequence: 50
        action: "permit"
        protocol: "ip"
