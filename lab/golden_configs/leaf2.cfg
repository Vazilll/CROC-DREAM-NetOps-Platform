!Software Version V200R005C10SPC607B607
#
sysname leaf-2
#
telnet server disable
telnet ipv6 server disable
#
ip vpn-instance __MGMT_VPN__
 route-distinguisher 65002:999
 ipv4-family
#
aaa
 undo local-user policy security-enhance
 local-user admin password irreversible-cipher $1c$yBvtPI$b;E$@jjr6#!F[M}7U|*y_d&NRgZHIFlV=SX@YzG*$..)$
 local-user admin service-type ssh
 local-user admin user-group manage-ug
 authentication-scheme default
 authorization-scheme default
 accounting-scheme default
 domain default
 domain default_admin
#
# REASON: ACL FABRIC-IN (как в leaf2.cfg), должна быть объявлена до использования в traffic-filter
acl name FABRIC-IN advance
 rule 10 permit icmp
 rule 20 permit tcp destination-port eq bgp
 rule 30 permit tcp source-port eq bgp
 rule 40 deny tcp destination-port eq telnet
 rule 50 permit ip
#
# REASON: Оставляем внутренний адрес vrnetlab 10.0.0.15 для проброса SSH
interface MEth0/0/0
 undo shutdown
 ip binding vpn-instance __MGMT_VPN__
 ip address 10.0.0.15 255.255.255.0
#
# REASON: Loopback интерфейс с Router-ID
interface LoopBack0
 description Router-ID / BGP announce
 ip address 10.255.0.2 255.255.255.255
#
# REASON: Линк к spine1 (GigabitEthernet3 на spine1): 'undo portswitch' переводит порт в режим L3
interface GE1/0/0
 description Uplink to spine1 GigabitEthernet3
 undo portswitch
 undo shutdown
 ip address 10.10.0.3 255.255.255.254
 traffic-filter inbound acl name FABRIC-IN
#
# REASON: Линк к spine2 (Ethernet2 на spine2)
interface GE1/0/1
 description Uplink to spine2 Ethernet2
 undo portswitch
 undo shutdown
 ip address 10.10.0.7 255.255.255.254
 traffic-filter inbound acl name FABRIC-IN
#
# REASON: Линк к host-b: перевод в L3 и шлюз 10.20.2.1/24
interface GE1/0/9
 description Access to host-b
 undo portswitch
 undo shutdown
 ip address 10.20.2.1 255.255.255.0
#
ip route-static vpn-instance __MGMT_VPN__ 0.0.0.0 0.0.0.0 10.0.0.2
#
# REASON: BGP процесс (ASN 65002): анонсирует Loopback и подсеть host-b (10.20.2.0/24) обоим спайнам
bgp 65002
 router-id 10.255.0.2
 peer 10.10.0.2 as-number 65000
 peer 10.10.0.2 description spine1
 peer 10.10.0.6 as-number 65000
 peer 10.10.0.6 description spine2
 #
 ipv4-family unicast
  undo synchronization
  network 10.255.0.2 255.255.255.255
  network 10.20.2.0 255.255.255.0
  maximum load-balancing 2
  peer 10.10.0.2 enable
  peer 10.10.0.6 enable
#
stelnet server enable
ssh user admin authentication-type password
ssh user admin service-type all
ssh authorization-type default aaa
#
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
#
return
