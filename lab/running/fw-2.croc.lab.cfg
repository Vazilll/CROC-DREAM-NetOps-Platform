system {
    host-name fw-2.croc.lab;
}
interfaces {
    lo0 {
        unit 0 {
            description "Perimeter Gateway Router ID";
            family inet {
                address 10.255.0.102/32;
            }
        }
    }
    ge-0/0/1 {
        description "Downlink to spine-1";
        mtu 9000;
        unit 0 {
            family inet {
                address 10.0.11.1/31;
            }
        }
    }
    ge-0/0/2 {
        description "Downlink to spine-2";
        mtu 9000;
        unit 0 {
            family inet {
                address 10.0.21.1/31;
            }
        }
    }
}
firewall {
    family inet {
        filter PROTECT-MGMT {
            term term-10 {
                from {
                    source-address {
                        172.20.20.0/24;
                    }
                }
                then {
                    accept;
                }
            }
            term term-20 {
                from {
                }
                then {
                    discard;
                }
            }
        }
    }
}
protocols {
    bgp {
        group CLOS-FABRIC {
            type external;
            local-as 65500;
            neighbor 10.0.11.0 {
                description "spine-1";
                peer-as 65000;
            }
            neighbor 10.0.21.0 {
                description "spine-2";
                peer-as 65000;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.102;
    autonomous-system 65500;
}
switch-options {
    vtep-source-interface lo0.0;
}
vlans {
    vlan-100 {
        vlan-id 100;
        vxlan {
            vni 10000;
        }
    }
}
