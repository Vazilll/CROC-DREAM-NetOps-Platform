sysname leaf-4.croc.lab
interface Loopback0
 description Router ID
 ip address 10.255.1.4 255.255.255.255
 undo shutdown
#
interface GE1/0/1
 description Uplink to spine-1
 ip address 10.0.4.1 255.255.255.254
 undo shutdown
#
interface GE1/0/2
 description Uplink to spine-2
 ip address 10.0.4.3 255.255.255.254
 undo shutdown
#
acl name MGMT-IN advance
 rule 10 permit tcp source 172.20.20.0 0.0.0.255 destination any
 rule 20 deny ip source any destination any
#
bgp 65104
 router-id 10.255.1.4
 peer 10.0.4.0 as-number 65000
 peer 10.0.4.0 description spine-1
 peer 10.0.4.2 as-number 65000
 peer 10.0.4.2 description spine-2
#
bridge-domain 10000
 vxlan 10000
#
