hostname spine-2.croc.lab
interface Loopback0
   description Router ID
   ip address 10.255.0.2/32
interface Ethernet1
   description Downlink to leaf-1
   mtu 9000
   no switchport
   ip address 10.0.1.2/31
interface Ethernet2
   description Downlink to leaf-2
   mtu 9000
   no switchport
   ip address 10.0.2.2/31
interface Ethernet3
   description Downlink to leaf-3
   mtu 9000
   no switchport
   ip address 10.0.3.2/31
interface Ethernet4
   description Downlink to leaf-4
   mtu 9000
   no switchport
   ip address 10.0.4.2/31
router bgp 65000
   router-id 10.255.0.2
   neighbor 10.0.1.3 remote-as 65101
   neighbor 10.0.1.3 description leaf-1
   neighbor 10.0.2.3 remote-as 65102
   neighbor 10.0.2.3 description leaf-2
   neighbor 10.0.3.3 remote-as 65103
   neighbor 10.0.3.3 description leaf-3
   neighbor 10.0.4.3 remote-as 65104
   neighbor 10.0.4.3 description leaf-4
   network 10.255.0.2/32
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vrf default vni 10000
